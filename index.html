<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOUKOU | Ema.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;800&family=Noto+Sans+JP:wght@300;400;500&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #E0E1DD;
    --paper: #0D1B2A;
    --card-bg: #1B263B;
    --ember: #778DA9;
    --ember-light: #415A77;
    --muted: #778DA9;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height: 100%;
    overflow: hidden;
  }

  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  .page{
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 4vh 24px;
    text-align: center;
  }

  .hero-trace{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -58%);
    width: min(70vw, 560px);
    height: auto;
    pointer-events: none;
    opacity: 0.6;
    z-index: 0;
  }

  .hero-trace path{
    fill: none;
    stroke: var(--ember-light);
    stroke-width: 1.2;
    stroke-linecap: round;
  }

  .stack{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.2vh;
    max-width: 560px;
  }

  .label{
    font-family: 'EB Garamond', serif;
    font-style: normal;
    font-weight: 500;
    font-size: clamp(44px, 9vh, 96px);
    letter-spacing: 0.08em;
    color: var(--ink);
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 0.9s;
  }

  h1{
    font-family: 'Shippori Mincho B1', serif;
    font-weight: 500;
    letter-spacing: 0.03em;
    font-size: clamp(22px, 3.6vh, 36px);
    line-height: 1.65;
    opacity: 0;
    animation: rise 1.1s ease forwards;
    animation-delay: 1.1s;
  }

  .statement{
    font-size: clamp(13px, 1.6vh, 15px);
    color: var(--muted);
    line-height: 1.9;
    max-width: 420px;
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 1.5s;
  }

  .modal-trigger-btn{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(119, 141, 169, 0.12);
    border: 1px solid var(--ember-light);
    font-family: 'Shippori Mincho B1', serif;
    font-size: clamp(12px, 1.3vh, 14px);
    color: var(--ink);
    cursor: pointer;
    padding: 6px 16px;
    border-radius: 20px;
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 1.65s;
  }

  .modal-trigger-btn:hover, .modal-trigger-btn:focus-visible{
    background: rgba(119, 141, 169, 0.25);
    border-color: var(--ember);
    color: var(--ink);
    outline: none;
  }

  .process-line{
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.6vw, 18px);
    font-family: 'Shippori Mincho B1', serif;
    font-size: clamp(13px, 1.6vh, 16px);
    color: var(--ink);
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 1.8s;
  }

  .process-line .sep{
    width: 20px;
    height: 1px;
    background: var(--ember-light);
  }

  .price{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8vh;
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 2.1s;
  }

  .price-figure{
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: clamp(28px, 4.4vh, 42px);
    color: var(--ink);
  }

  .price-figure span{
    font-size: 0.75em;
    font-style: italic;
    color: var(--ember);
    margin-left: 6px;
  }

  .cta{
    display: inline-block;
    margin-top: 0.6vh;
    padding: clamp(11px, 1.6vh, 15px) clamp(28px, 4vw, 38px);
    border: 1px solid var(--ink);
    border-radius: 999px;
    text-decoration: none;
    font-size: clamp(13px, 1.5vh, 15px);
    letter-spacing: 0.06em;
    color: var(--ink);
    transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 2.4s;
  }

  .cta:hover, .cta:focus-visible{
    background: var(--ink);
    color: var(--paper);
  }

  .cta:focus-visible{
    outline: 2px solid var(--ember);
    outline-offset: 3px;
  }

  .cta-sub{
    margin-left: 0.5em;
    font-size: 0.8em;
    opacity: 0.75;
  }

  .mail-link{
    display: inline-block;
    margin-top: 1.2vh;
    font-size: clamp(11px, 1.2vh, 13px);
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.02em;
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 2.5s;
  }

  .mail-link:hover, .mail-link:focus-visible{
    color: var(--ink);
  }

  .mark{
    position: absolute;
    bottom: 3vh;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Shippori Mincho B1', serif;
    font-size: clamp(10px, 1.2vh, 12px);
    letter-spacing: 0.2em;
    color: var(--muted);
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 2.6s;
  }

  /* Popup Modal Styles */
  .modal-overlay{
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(13, 27, 42, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }

  .modal-overlay.is-visible{
    opacity: 1;
    visibility: visible;
  }

  .modal-card{
    background: var(--card-bg);
    border: 1px solid var(--ember-light);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    border-radius: 16px;
    width: min(90vw, 440px);
    padding: clamp(24px, 5vw, 36px);
    position: relative;
    text-align: left;
    transform: translateY(20px) scale(0.97);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .modal-overlay.is-visible .modal-card{
    transform: translateY(0) scale(1);
  }

  .modal-close-btn{
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 22px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .modal-close-btn:hover, .modal-close-btn:focus-visible{
    background: rgba(119, 141, 169, 0.2);
    color: var(--ink);
    outline: none;
  }

  .modal-title{
    font-family: 'Shippori Mincho B1', serif;
    font-weight: 500;
    font-size: clamp(17px, 3vw, 20px);
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--ember-light);
  }

  .modal-list{
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 24px;
  }

  .modal-list li{
    position: relative;
    padding-left: 20px;
    font-size: clamp(13px, 2.2vw, 14.5px);
    line-height: 1.7;
    color: var(--ink);
    word-break: auto-phrase;
    line-break: strict;
  }

  .modal-list li::before{
    content: "―";
    position: absolute;
    left: 0;
    color: var(--ember);
    font-weight: bold;
  }

  .modal-action-btn{
    display: block;
    width: 100%;
    padding: 12px 20px;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 999px;
    text-align: center;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .modal-action-btn:hover, .modal-action-btn:focus-visible{
    background: var(--ember);
    border-color: var(--ember);
    color: var(--paper);
    outline: none;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .label, h1, .statement, .modal-trigger-btn, .process-line, .price, .cta, .mail-link, .mark{
      animation: none !important;
      opacity: 1 !important;
    }
    .modal-overlay, .modal-card{
      transition: none !important;
    }
  }

  @media (max-height: 560px){
    .stack{ gap: 1.6vh; }
  }
</style>
</head>
<body>

  <div class="page">
    <svg class="hero-trace" viewBox="0 0 600 300" aria-hidden="true">
      <path id="heroPath" d="M 20 220 C 140 260, 200 60, 320 110 S 480 240, 580 90" />
    </svg>

    <div class="stack">
      <p class="label">DOUKOU</p>
      <h1>プロセスポートレートで<br>あなたの在り方を<br>記録しましょう。</h1>
      <p class="statement">あなたの在り方であれば、ジャンルはなんでも。<br>得られるもの：同行中のあなたの写真・動画<br>個人の記録や発信、事業利用にお使いください。<br>※カメラやマイクは、独自の感覚で選んだものを使用。</p>

      <button type="button" class="modal-trigger-btn" id="openModalBtn" aria-haspopup="dialog">
        こんな瞬間を残したい人へ ✦
      </button>

      <div class="process-line">
        <span>話す</span>
        <span class="sep"></span>
        <span>掘る</span>
        <span class="sep"></span>
        <span>撮る</span>
      </div>

      <div class="price">
        <div class="price-figure">¥35,000<span>〜</span></div>
      </div>

      <a class="cta" href="https://www.instagram.com/tayu__t/" target="_blank" rel="noopener">撮影を依頼する<span class="cta-sub">[DMへ]</span></a>
      <a class="mail-link" href="mailto:tanachu09@gmail.com">tanachu09@gmail.com</a>
    </div>

    <p class="mark">Ema.</p>
  </div>

  <!-- Popup Modal -->
  <div class="modal-overlay" id="targetModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <button type="button" class="modal-close-btn" id="closeModalBtn" aria-label="閉じる">&times;</button>
      <h2 class="modal-title" id="modalTitle">こんな瞬間を残したい人へ。</h2>
      <ul class="modal-list">
        <li>自分の仕事をしている姿を残したい</li>
        <li>何かを始めた今を残したい</li>
        <li>自分では気づいていない姿を知りたい</li>
        <li>SNS用の写真だけではなく、自分自身の記録が欲しい</li>
      </ul>
      <button type="button" class="modal-action-btn" id="modalConfirmBtn">閉じる</button>
    </div>
  </div>

<script>
  var heroPath = document.getElementById('heroPath');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (heroPath){
    if (reduceMotion){
      heroPath.style.strokeDasharray = 'none';
    } else {
      var length = heroPath.getTotalLength();
      heroPath.style.strokeDasharray = length;
      heroPath.style.strokeDashoffset = length;
      heroPath.style.transition = 'stroke-dashoffset 1.8s cubic-bezier(0.65, 0, 0.35, 1)';
      requestAnimationFrame(function(){
        setTimeout(function(){
          heroPath.style.strokeDashoffset = '0';
        }, 150);
      });
    }
  }

  /* Modal Logic */
  var modal = document.getElementById('targetModal');
  var openBtn = document.getElementById('openModalBtn');
  var closeBtn = document.getElementById('closeModalBtn');
  var confirmBtn = document.getElementById('modalConfirmBtn');

  function openModal() {
    modal.classList.add('is-visible');
    closeBtn.focus();
  }

  function closeModal() {
    modal.classList.remove('is-visible');
    if (document.activeElement && modal.contains(document.activeElement)) {
      openBtn.focus();
    }
  }

  openBtn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  confirmBtn.addEventListener('click', closeModal);

  modal.addEventListener('click', function(e) {
    if (e.target === modal) {
      closeModal();
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.classList.contains('is-visible')) {
      closeModal();
    }
  });

  // Automatically show popup on first visit/load so it's immediately visible
  window.addEventListener('load', function() {
    setTimeout(openModal, 400);
  });
</script>

</body>
</html>
