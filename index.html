.logo{font:500 26px var(--gar);letter-spacing:.06em}

.perm{font-size:clamp(15.5px,1.7vw,19px);line-height:2.05;margin-bottom:20px}

.btn{border-bottom:1px solid var(--ink);padding-bottom:4px}
.btn.p{border-color:var(--beige)}

.ft{display:grid;grid-template-columns:5fr 6fr;gap:clamp(32px,7vw,100px)}

  padding-left:1.1em;

}
