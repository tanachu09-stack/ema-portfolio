<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOUKOU | Ema.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;800&family=Noto+Sans+JP:wght@300;400;500&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #243028;
    --paper: #f6faf7;
    --ember: #588c64;
    --ember-light: #a8c9b2;
    --muted: #7a8c80;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height: 100%;
    overflow: hidden;
  }

  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  .page{
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 4vh 24px;
    text-align: center;
  }

  .hero-trace{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -58%);
    width: min(70vw, 560px);
    height: auto;
    pointer-events: none;
    opacity: 0.5;
    z-index: 0;
  }

  .hero-trace path{
    fill: none;
    stroke: var(--ember-light);
    stroke-width: 1.2;
    stroke-linecap: round;
  }

  .stack{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.6vh;
    max-width: 560px;
  }

  .label{
    font-family: 'EB Garamond', serif;
    font-style: normal;
    font-weight: 500;
    font-size: clamp(44px, 9vh, 96px);
    letter-spacing: 0.08em;
    color: var(--ink);
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 0.9s;
  }

  h1{
    font-family: 'Shippori Mincho B1', serif;
    font-weight: 500;
    letter-spacing: 0.03em;
    font-size: clamp(22px, 3.6vh, 36px);
    line-height: 1.65;
    opacity: 0;
    animation: rise 1.1s ease forwards;
    animation-delay: 1.1s;
  }

  .statement{
    font-size: clamp(13px, 1.6vh, 15px);
    color: var(--muted);
    line-height: 1.9;
    max-width: 420px;
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 1.5s;
  }

  .process-line{
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.6vw, 18px);
    font-family: 'Shippori Mincho B1', serif;
    font-size: clamp(13px, 1.6vh, 16px);
    color: var(--ink);
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 1.8s;
  }

  .process-line .sep{
    width: 20px;
    height: 1px;
    background: var(--ember-light);
  }

  .price{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8vh;
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 2.1s;
  }

  .price-figure{
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: clamp(28px, 4.4vh, 42px);
    color: var(--ink);
  }

  .price-figure span{
    font-size: 0.4em;
    font-style: normal;
    color: var(--muted);
    margin-left: 4px;
  }

  .price-note{
    font-size: clamp(11px, 1.3vh, 13px);
    color: var(--muted);
  }

  .cta{
    display: inline-block;
    margin-top: 0.6vh;
    padding: clamp(11px, 1.6vh, 15px) clamp(28px, 4vw, 38px);
    border: 1px solid var(--ink);
    border-radius: 999px;
    text-decoration: none;
    font-size: clamp(13px, 1.5vh, 15px);
    letter-spacing: 0.06em;
    color: var(--ink);
    transition: background 0.3s ease, color 0.3s ease;
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 2.4s;
  }

  .cta:hover, .cta:focus-visible{
    background: var(--ink);
    color: var(--paper);
  }

  .cta:focus-visible{
    outline: 2px solid var(--ember);
    outline-offset: 3px;
  }

  .mark{
    position: absolute;
    bottom: 3vh;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Shippori Mincho B1', serif;
    font-size: clamp(10px, 1.2vh, 12px);
    letter-spacing: 0.2em;
    color: var(--muted);
    opacity: 0;
    animation: rise 1s ease forwards;
    animation-delay: 2.6s;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .label, h1, .statement, .process-line, .price, .cta, .mark{
      animation: none !important;
      opacity: 1 !important;
    }
  }

  @media (max-height: 560px){
    .stack{ gap: 1.6vh; }
  }
</style>
</head>
<body>

  <div class="page">
    <svg class="hero-trace" viewBox="0 0 600 300" aria-hidden="true">
      <path id="heroPath" d="M 20 220 C 140 260, 200 60, 320 110 S 480 240, 580 90" />
    </svg>

    <div class="stack">
      <p class="label">DOUKOU</p>
      <h1>プロセスポートレートで<br>あなたの在り方を記録しましょう。</h1>
      <p class="statement">得られるもの：同行中のあなたの写真・動画<br>※カメラやマイクは、独自の感覚で選んだものを使用。</p>

      <div class="process-line">
        <span>話す</span>
        <span class="sep"></span>
        <span>掘る</span>
        <span class="sep"></span>
        <span>撮る</span>
      </div>

      <div class="price">
        <div class="price-figure">¥35,000<span>〜</span></div>
      </div>

      <a class="cta" href="https://www.instagram.com/tayu__t/" target="_blank" rel="noopener">撮影を依頼する [DMへ]</a>
    </div>

    <p class="mark">Ema.</p>
  </div>

<script>
  var heroPath = document.getElementById('heroPath');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (heroPath){
    if (reduceMotion){
      heroPath.style.strokeDasharray = 'none';
    } else {
      var length = heroPath.getTotalLength();
      heroPath.style.strokeDasharray = length;
      heroPath.style.strokeDashoffset = length;
      heroPath.style.transition = 'stroke-dashoffset 1.8s cubic-bezier(0.65, 0, 0.35, 1)';
      requestAnimationFrame(function(){
        setTimeout(function(){
          heroPath.style.strokeDashoffset = '0';
        }, 150);
      });
    }
  }
</script>

</body>
</html>
